name: jmail

# ---------------------------------------------------------------------------
# JMail local stack.
#
#   docker compose -f docker/compose.yml up -d              # database + mail server
#   docker compose -f docker/compose.yml --profile full up  # + backend + web app
#
# `./run.sh` drives this file; you should rarely need to call it by hand.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:17-alpine
    container_name: jmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jmail}
      POSTGRES_USER: ${POSTGRES_USER:-jmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jmail_local_dev}
      # Deterministic collation so ORDER BY on subjects/senders matches test expectations.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` alone returns healthy before the init scripts finish; querying a real
      # table-free statement guarantees the server accepts connections from the backend.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jmail} -d ${POSTGRES_DB:-jmail} && psql -U ${POSTGRES_USER:-jmail} -d ${POSTGRES_DB:-jmail} -c 'SELECT 1' > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"

  adminer:
    image: adminer:5-standalone
    container_name: jmail-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8081}:8080"

  # Local IMAP/SMTP server. Lets you exercise the Exchange/IMAP sign-in path and send real
  # messages without touching an external provider.
  greenmail:
    image: greenmail/standalone:2.1.3
    container_name: jmail-greenmail
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "${GREENMAIL_SMTP_PORT:-3025}:3025"
      - "${GREENMAIL_IMAP_PORT:-3143}:3143"
      - "${GREENMAIL_API_PORT:-8080}:8080"

  backend:
    profiles: ["full"]
    # When a service declares both `image` and `build`, Compose builds and tags — it does
    # not pull. So this names the locally built image, and `./run.sh docker` overrides
    # JMAIL_BACKEND_IMAGE with the published one and passes --no-build to use it as-is.
    image: ${JMAIL_BACKEND_IMAGE:-jmail-backend:local}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: jmail-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      JMAIL_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jmail}
      JMAIL_DB_USER: ${POSTGRES_USER:-jmail}
      JMAIL_DB_PASSWORD: ${POSTGRES_PASSWORD:-jmail_local_dev}
      JMAIL_JWT_SECRET: ${JMAIL_JWT_SECRET:-}
      JMAIL_DEMO_ENABLED: ${JMAIL_DEMO_ENABLED:-true}
      JMAIL_WEB_ORIGIN: ${JMAIL_WEB_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  web:
    profiles: ["full"]
    # As with the backend: `image` names the locally built result, and `./run.sh docker`
    # overrides it with the published one and passes --no-build.
    image: ${JMAIL_WEB_IMAGE:-jmail-web:local}
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: jmail-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres-data:
    name: jmail-postgres-data
