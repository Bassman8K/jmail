server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WebAssembly must be served with the correct type or the streaming compiler refuses it.
    types {
        application/wasm wasm;
        text/html        html;
        text/javascript  js;
        text/css         css;
        image/svg+xml    svg;
        application/json json;
    }

    gzip on;
    # text/html is always gzipped by nginx and listing it again logs a duplicate-MIME
    # warning on every start.
    gzip_types text/css text/javascript application/json application/wasm;
    gzip_min_length 1024;

    # Hashed build outputs are immutable; the entry document never is.
    location ~* \.(wasm|js|css)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Single-page app: unknown paths render the shell and the app routes internally.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy, so the browser build needs no CORS preflight in production.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
