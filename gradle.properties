org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true
kotlin.js.yarn=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Optional targets: true | false | auto (auto = enable when the SDK is installed)
jmail.android.enabled=auto
jmail.ios.enabled=auto

# Coverage floors enforced by `./gradlew koverVerify`. See the comment in build.gradle.kts
# for why the branch floor is lower than the line floor.
jmail.coverage.min=80
jmail.coverage.branch.min=45
