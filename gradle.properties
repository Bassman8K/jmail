org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true
kotlin.js.yarn=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Optional targets: true | false | auto (auto = enable when the SDK is installed)
jmail.android.enabled=auto
jmail.ios.enabled=auto

# Coverage floors enforced by `./gradlew koverVerify`, measured over the code that has
# behaviour to assert — see the excludes in build.gradle.kts for what is left out and why.
# Branch is the lower of the two because a `?:` on a nullable field the API never omits is
# a branch no honest test can take.
jmail.coverage.min=92
jmail.coverage.branch.min=70
