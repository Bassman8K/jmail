name: CI

on:
  push:
    branches: [main]
    # Several jobs gate on `refs/tags/v*`, and the release job only runs there --
    # without this the tag push produced no run at all.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest

    services:
      # The integration tests prefer a running PostgreSQL over Testcontainers, which keeps
      # the suite fast here and identical to what a developer runs locally.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jmail
          POSTGRES_USER: jmail
          POSTGRES_PASSWORD: jmail_local_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U jmail"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install the extensions the schema needs
        run: |
          # pg_trgm and uuid-ossp require superuser, so they cannot live in a migration.
          PGPASSWORD=jmail_local_dev psql -h localhost -U jmail -d jmail \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;' \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run every test with the coverage gate
        run: ./gradlew verifyAll --stacktrace
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/build/reports/tests/
            shared/build/reports/tests/
            composeApp/build/reports/tests/
          retention-days: 14

      - name: Publish the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/
          retention-days: 14

      - name: Summarise coverage in the run
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, os
          path = "build/reports/kover/report.xml"
          if not os.path.exists(path):
              print("No coverage report was produced."); raise SystemExit
          root = ET.parse(path).getroot()
          totals = {c.get("type"): c for c in root.findall("counter")}
          print("## Coverage\n")
          print("| Metric | Covered |")
          print("|---|---|")
          for metric in ("LINE", "BRANCH"):
              counter = totals.get(metric)
              if counter is None: continue
              missed, covered = int(counter.get("missed")), int(counter.get("covered"))
              total = missed + covered
              print(f"| {metric.title()} | {100 * covered / total:.1f}% ({covered}/{total}) |")
          PY

  build-web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the WebAssembly bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jmail-web
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 14

  build-installers:
    name: ${{ matrix.label }}
    # Installers take minutes and produce large artifacts, so pull requests skip them.
    # They run on a version tag, on demand, and on main so there is always a fresh build.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS installer (.dmg, .pkg)
            artifact: jmail-macos
            glob: "*.dmg *.pkg"
          - os: windows-latest
            label: Windows installer (.msi, .exe)
            artifact: jmail-windows
            glob: "*.msi *.exe"
          - os: ubuntu-latest
            label: Linux packages (.deb, .rpm)
            artifact: jmail-linux
            glob: "*.deb *.rpm"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install rpm tooling
        if: matrix.os == 'ubuntu-latest'
        # jpackage shells out to rpmbuild for the .rpm; the Ubuntu image does not ship it.
        #
        # This step is allowed to fail. Unattended-upgrades runs on a fresh runner and holds
        # the dpkg lock, and apt will wait on it forever -- one run sat here for 35 minutes
        # before the job was cancelled. The variables keep dpkg and needrestart from opening
        # a prompt nobody can answer, and the build step below drops to a .deb-only package
        # if rpmbuild still is not there, so a bad apt day cannot block a release.
        continue-on-error: true
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          for _ in $(seq 1 30); do
            sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
            echo "waiting for the dpkg lock…"
            sleep 5
          done
          sudo -E apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          sudo -E apt-get install -y --no-install-recommends rpm fakeroot

      # jpackage cannot cross-compile: each installer must be built on its own OS, which is
      # the whole reason this job is a matrix. Linux gets its own step because it is the one
      # that has to cope with rpmbuild being missing -- and a shell `if` cannot live in the
      # shared step, since the Windows runner would run it through PowerShell.
      - name: Build the native installer
        if: matrix.os != 'ubuntu-latest'
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace

      - name: Build the native packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          if command -v rpmbuild >/dev/null 2>&1; then
            ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace
          else
            echo "::warning::rpmbuild is unavailable, packaging the .deb only"
            ./gradlew :composeApp:packageDeb --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/pkg/*.pkg
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 30

  build-android:
    name: Android (.apk, .aab)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing keystore
        # Android refuses to install an unsigned APK, so a release build has to be signed.
        # The keystore is held as a base64 secret because Actions secrets are text; it is
        # written outside the workspace so it can never be picked up by an upload step.
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::no signing keystore configured, the APK will be unsigned"
            exit 0
          fi
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/signing/release.keystore"
          echo "path=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build the APK and app bundle
        # The Android target switches itself on when an SDK is present; the runner has one,
        # so it is enabled explicitly rather than relying on detection.
        run: |
          ./gradlew :composeApp:packageAndroidArtifacts \
            -Pjmail.android.enabled=true --stacktrace
        env:
          # Unsigned unless a keystore is provided through repository secrets.
          JMAIL_ANDROID_KEYSTORE: ${{ steps.keystore.outputs.path }}
          JMAIL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JMAIL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JMAIL_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Check the APK really is signed
        # A silently unsigned APK is the failure this whole job exists to avoid: it uploads
        # cleanly and only fails on the user's phone.
        run: |
          apk=composeApp/build/outputs/jmail/JMail-1.0.0.apk
          # The runner ships several build-tools versions, so the glob has to be resolved to
          # one path -- passing all of them makes apksigner read the second as a subcommand.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk"
          "$apksigner" verify "$apk" || { echo "::error::the APK is not signed"; exit 1; }

      - name: Delete the keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - uses: actions/upload-artifact@v4
        with:
          name: jmail-android
          path: composeApp/build/outputs/jmail/*
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: iOS (simulator build)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the shared framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 -Pjmail.ios.enabled=true --stacktrace

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          # The app icon is rendered from code, so it has to be written into the asset
          # catalog before Xcode compiles it -- an empty catalog fails the build.
          ./gradlew :composeApp:generateIosAppIcon -Pjmail.ios.enabled=true
          cd iosApp && xcodegen generate

      - name: Build for the simulator
        # An installable .ipa needs an Apple Developer signing identity, which cannot live in
        # a public repository. This proves the app compiles and links for iOS; producing a
        # device build is a signing step, not a code change.
        #
        # Debug, matching the framework linked in the previous step: linking the Kotlin
        # framework in Release crashed clang with `Bus error: 10` on the 7 GB arm64 runner,
        # and Debug is a fraction of the memory and time. `ENABLE_DEBUG_DYLIB=NO` in
        # project.yml is what keeps Debug producing a real executable rather than a stub.
        run: |
          if ! xcodebuild -project iosApp/JMail.xcodeproj -scheme JMail \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath iosApp/build \
              CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1; then
            echo "::group::xcodebuild errors"
            grep -nE "error:|warning: .*framework|BUILD FAILED|The following build commands failed" -A4 xcodebuild.log | tail -80
            echo "::endgroup::"
            echo "::group::last 120 lines"
            tail -120 xcodebuild.log
            echo "::endgroup::"
            exit 1
          fi
          tail -5 xcodebuild.log

      - name: Package the simulator app
        run: |
          app=iosApp/build/Build/Products/Debug-iphonesimulator/JMail.app
          # A bundle with no executable is the failure this step used to hide.
          if [ ! -x "$app/JMail" ]; then
            echo "::error::no linked executable in $app"
            ls -lR "$(dirname "$app")" || true
            exit 1
          fi
          ditto -c -k --keepParent "$app" JMail-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: jmail-ios-simulator
          path: JMail-simulator.zip
          if-no-files-found: warn
          retention-days: 30

  deploy-web:
    name: Web app (GitHub Pages)
    # main only: the github-pages environment refuses a deployment from a tag ref, and the
    # site should track main regardless of when a version is cut.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the WebAssembly bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Prepare the site
        run: |
          cd composeApp/build/dist/wasmJs/productionExecutable
          # No backend is bundled with a static host, so the app reads ?api=… instead.
          # index.html is copied to 404.html so deep links resolve on Pages.
          echo 'window.JMAIL_API_URL = null;' > config.js
          cp index.html 404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-installers, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the shippable builds -- not the coverage report, test reports, or the
          # buildx metadata that downloading everything would drag in.
          pattern: jmail-*
          path: artifacts

      - name: Bundle the web app into a single file
        # The web artifact is an unpacked site; uploaded as-is it scatters index.html, two
        # .wasm blobs and the source map across the release page as separate downloads.
        run: |
          ( cd artifacts/jmail-web && zip -qr "$GITHUB_WORKSPACE/jmail-web-${GITHUB_REF_NAME}.zip" . )
          rm -rf artifacts/jmail-web

      - name: Attach every build to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            jmail-web-*.zip
          generate_release_notes: true
          body: |
            Download the build for your platform below.

            | Platform | File |
            |---|---|
            | macOS | `.dmg` (drag to Applications) or `.pkg` |
            | Windows | `.msi` (installer) or `.exe` |
            | Linux | `.deb` (Debian, Ubuntu) or `.rpm` (Fedora, RHEL) |
            | Android | `.apk` to sideload, `.aab` for the Play Store |
            | iOS | simulator build; a device build needs your own signing identity |
            | Web | `jmail-web-*.zip` to self-host, or use the hosted build linked in the README |

            Every desktop and mobile build needs the JMail backend running — see the README
            for `./run.sh`, which starts it with one command.

  build-images:
    name: ${{ matrix.label }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Backend
            image: jmail-backend
            dockerfile: docker/backend.Dockerfile
          - label: Web
            image: jmail-web
            dockerfile: docker/web.Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Every push builds the image; only main and version tags publish it, so a pull
      # request from a fork can never write to the registry.
      - name: Sign in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `edge` tracks main; a version tag also moves `latest`, which is what
          # docker/compose.yml pulls by default.
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          # linux/arm64 as well, so an Apple Silicon machine does not emulate the backend.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
