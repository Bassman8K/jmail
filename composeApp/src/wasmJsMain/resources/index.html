<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="JMail — all your mail, in one place.">
    <meta name="color-scheme" content="light dark">
    <title>JMail</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234F46E5'/%3E%3Cpath d='M14 22h36v22H14z' fill='%23fff'/%3E%3Cpath d='M14 22l18 13 18-13' fill='none' stroke='%234F46E5' stroke-width='3'/%3E%3Ccircle cx='46' cy='18' r='6' fill='%23F59E0B'/%3E%3C/svg%3E">

    <style>
        /* The shell is styled here rather than in Compose so that something sensible is on
           screen during the WebAssembly download, before any Kotlin has run. */
        :root { color-scheme: light dark; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #FAFBFC;
            color: #15171C;
        }

        @media (prefers-color-scheme: dark) {
            html, body { background: #0F1115; color: #E3E6EB; }
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity .25s ease;
        }

        #loading.hidden { opacity: 0; pointer-events: none; }

        .mark {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 24px;
        }

        .hint { font-size: 14px; opacity: .65; }

        .bar {
            width: 180px;
            height: 3px;
            border-radius: 999px;
            background: rgba(127, 127, 127, .25);
            overflow: hidden;
        }

        .bar::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            border-radius: inherit;
            background: #4F46E5;
            animation: slide 1.1s ease-in-out infinite;
        }

        @keyframes slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        /* Respect a user's reduced-motion preference: the bar becomes static. */
        @media (prefers-reduced-motion: reduce) {
            .bar::after { animation: none; width: 100%; opacity: .5; }
        }

        noscript { display: block; padding: 32px; text-align: center; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="mark" aria-hidden="true">J</div>
        <div class="bar" role="progressbar" aria-label="Loading JMail"></div>
        <div class="hint">Loading JMail…</div>
    </div>

    <noscript>
        JMail needs JavaScript and WebAssembly to run. Please enable them, or use the desktop
        or mobile app.
    </noscript>

    <script>
        // Point the browser build at a backend on another origin during development.
        // In production nginx proxies /api on this same origin, so this stays unset.
        window.JMAIL_API_URL = window.JMAIL_API_URL || null;

        // Compose renders into <body>; hide the shell once it has painted.
        window.addEventListener('load', function () {
            var attempts = 0;
            var timer = setInterval(function () {
                var canvasPresent = document.querySelector('canvas') !== null;
                if (canvasPresent || ++attempts > 200) {
                    var loading = document.getElementById('loading');
                    if (loading) loading.classList.add('hidden');
                    clearInterval(timer);
                }
            }, 100);
        });
    </script>

    <script type="application/javascript" src="jmail.js"></script>
</body>
</html>
